[workspace]
members = [
    "ket-cas",
    "ket-dag",
    "ket-sql",
    "ket-mcp",
    "ket-agent",
    "ket-score",
    "ket-cdom",
    "ket-cli",
    "ket-py",
    "ket-opt",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nickjoven/ket"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std"] }
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
base64 = "0.22"

# Internal crates
ket-cas = { path = "ket-cas", version = "0.2.0" }
ket-dag = { path = "ket-dag", version = "0.2.0" }
ket-sql = { path = "ket-sql", version = "0.2.0" }
ket-mcp = { path = "ket-mcp", version = "0.2.0" }
ket-agent = { path = "ket-agent", version = "0.2.0" }
ket-score = { path = "ket-score", version = "0.2.0" }
ket-cdom = { path = "ket-cdom", version = "0.2.0" }
ket-opt = { path = "ket-opt", version = "0.2.0" }
