name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"   # nightly: catches substrate drift even with no commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Non-Dolt half of the suite: unit tests, ket-cas/dag/sql pure paths.
  # Always runs, always gates. Anything that doesn't need a live Dolt goes here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ket-py's PyO3 (0.23) supports CPython up to 3.13; ubuntu-latest now
      # ships 3.14, and the workspace build fails in pyo3-ffi's build script.
      # Pin the interpreter until PyO3 is upgraded.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      # The pinned PyO3 0.23 supports Python through 3.13; ubuntu-latest's
      # default interpreter can advance independently of our Rust lockfile.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: cargo build --workspace
      - name: Unit tests (all crates)
        # Skip ket-cli's integration.rs — its Dolt-touching tests short-circuit
        # via has_dolt(), so running them here would be silently vacuous.
        # The dolt-gate job below is the honest home for those.
        run: |
          cargo test --workspace --lib
          cargo test -p ket-sql
      - name: CLI and MCP support-loss parity
        run: cargo test -p ket-cli --test invalidated
      - name: Labelling and consistency CLI
        run: cargo test -p ket-cli --test labelling
      - name: Offline support-loss artifact checks
        run: |
          python3 docs/retraction-poc/acceptance_report.py \
            --ket target/debug/ket --output "$RUNNER_TEMP/ket24-acceptance" \
            --check-against docs/retraction-poc/acceptance-fixtures
          python3 scripts/retraction-poc/publication_check.py \
            --output "$RUNNER_TEMP/ket24-publication.json" \
            --check-against docs/retraction-poc/publication/evaluation.json
      - name: Pinned XMRV replay reproduces the committed v1 reports
        # The regression baseline for any change to propagation rules: an
        # offline replay of the pinned capture must render byte-identical
        # paper results. A new rule set ships as a new report schema beside
        # v1, never by changing these.
        run: |
          python3 scripts/retraction-poc/replay.py \
            --capture fixtures/retraction-poc/verified \
            --ket target/debug/ket --output "$RUNNER_TEMP/ket24-replay"
          python3 docs/retraction-poc/render_papers.py \
            --replay "$RUNNER_TEMP/ket24-replay" \
            --capture fixtures/retraction-poc/verified \
            --output "$RUNNER_TEMP/ket24-render"
          diff -r "$RUNNER_TEMP/ket24-render/paper-results" docs/retraction-poc/paper-results
          cmp "$RUNNER_TEMP/ket24-render/paper-report.md" docs/retraction-poc/paper-report.md
      - name: Lint (informational, non-blocking)
        continue-on-error: true
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

  # Everything that needs a live Dolt: the whole ket-cli integration suite
  # (`ket run`, tasks, repair, projection) and ket-sql's Dolt-backed tests.
  # Those tests return early when dolt is absent, so in the `test` job they
  # would pass without running; here Dolt is installed and they gate.
  dolt-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version
      - name: Configure Dolt identity
        run: |
          dolt config --global --add user.name "ket-ci"
          dolt config --global --add user.email "ci@ket.local"
      - name: Dolt-backed tests (ket-sql, ket-cli integration)
        run: |
          cargo test -p ket-sql
          cargo test -p ket-cli --test integration

  # The L3 audit gate: verify_projection must return clean on a fresh substrate,
  # and rebuild_projection must be idempotent. This is the CI form of the ket
  # DESIGN.md test — "throw away everything except CAS + log; can you rebuild
  # the projection bit-identically?" A failure here is a substrate bug, not a
  # flake, so we DO NOT continue-on-error.
  projection-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version
      - name: Configure Dolt identity
        # dolt needs a name/email or `dolt init` refuses to run.
        run: |
          dolt config --global --add user.name "ket-ci"
          dolt config --global --add user.email "ci@ket.local"
      - name: Run the projection audit + heal round-trip
        run: |
          cargo test -p ket-cli --test integration -- \
            verify_projection_after_repair_is_clean \
            rebuild_projection_heals_and_is_idempotent
      - name: Recover interrupted DAG creates without another node
        run: |
          cargo build -p ket-cli
          python3 scripts/test_dag_recovery.py --ket target/debug/ket -v
